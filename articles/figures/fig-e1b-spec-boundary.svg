<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="추측 디코딩의 처리량 이득이 동시성 48과 64 사이에서 손해로 전환되는 반복 측정 결과">
<style>
  .surface { fill: #fcfcfb; }
  .ink { fill: #11110f; }
  .sub { fill: #595852; }
  .muted { fill: #85837c; }
  .grid { stroke: #e2e0d8; }
  .axis { stroke: #aaa89f; }
  .main { stroke: #1677d2; fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .point { fill: #1677d2; }
  .range { stroke: #1677d2; stroke-width: 2; }
  .zone { fill: #eb6834; opacity: .08; }
  .zero { stroke: #eb6834; stroke-width: 2; }
  text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
  .ttl { font-size: 21px; font-weight: 700; }
  .stl { font-size: 13px; }
  .tick { font-size: 12px; font-variant-numeric: tabular-nums; }
  .label { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .callout { font-size: 14px; font-weight: 700; }
</style>
<rect class="surface" width="900" height="520"/>
<text class="ttl ink" x="78" y="34">수용률 100%여도 동시성 64에서는 손해가 났다</text>

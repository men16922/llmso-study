<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450" role="img" aria-labelledby="title desc">
<title id="title">FP8 양자화가 처리량을 높일 수 있는 두 경로</title>
<desc id="desc">모델 메모리 감소로 KV 캐시 공간이 늘어 더 많은 요청을 수용하는 경로와, 가중치 및 활성화 정밀도와 커널이 바뀌어 토큰 처리시간이 줄어드는 경로. 두 경로는 함께 작동할 수 있다. FP8을 유지한 채 KV 예산을 줄여 첫 경로의 필요성을 확인한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#687789"/></marker></defs>
<rect width="820" height="450" rx="12" fill="#fafaf8"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">

<rect x="290" y="20" width="240" height="48" rx="8" fill="#dfeaf8"/>
<text x="410.0" y="51.0" text-anchor="middle" fill="#17202b" font-size="20" font-weight="600">FP8 양자화</text>
<path d="M350 68 V86 H216 V103" fill="none" stroke="#687789" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M470 68 V86 H604 V103" fill="none" stroke="#687789" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="110" width="340" height="80" rx="8" fill="#eef2f7"/>
<text x="216.0" y="144.0" text-anchor="middle" fill="#17202b" font-size="20" font-weight="400">모델 메모리 감소</text>
<text x="216.0" y="170.0" text-anchor="middle" fill="#17202b" font-size="20" font-weight="400">→ KV 캐시 공간 증가</text>
<rect x="434" y="110" width="340" height="80" rx="8" fill="#eef2f7"/>
<text x="604.0" y="144.0" text-anchor="middle" fill="#17202b" font-size="20" font-weight="400">가중치·활성화 정밀도</text>
<text x="604.0" y="170.0" text-anchor="middle" fill="#17202b" font-size="20" font-weight="400">및 커널 변화</text>
<path d="M216 190 V218" fill="none" stroke="#687789" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M604 190 V218" fill="none" stroke="#687789" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="225" width="340" height="55" rx="8" fill="#eef2f7"/>
<text x="216.0" y="259.5" text-anchor="middle" fill="#17202b" font-size="20" font-weight="400">더 많은 요청 수용 가능</text>
<rect x="434" y="225" width="340" height="55" rx="8" fill="#eef2f7"/>
<text x="604.0" y="259.5" text-anchor="middle" fill="#17202b" font-size="20" font-weight="400">토큰 처리시간 단축 가능</text>
<path d="M216 280 V304 H350 V321" fill="none" stroke="#687789" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M604 280 V304 H470 V321" fill="none" stroke="#687789" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="290" y="328" width="240" height="48" rx="8" fill="#dfeaf8"/>
<text x="410.0" y="359.0" text-anchor="middle" fill="#17202b" font-size="20" font-weight="600">처리량 증가</text>
<rect x="28" y="397" width="764" height="35" rx="8" fill="#e7f3ef"/>
<text x="410.0" y="421.5" text-anchor="middle" fill="#17202b" font-size="20" font-weight="400">검증 질문  ·  FP8은 유지하고 KV 예산만 줄이면 이득이 사라질까?</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-label="계층 한 겹이 TTFT에 더하는 시간">
<style>
  .surface { fill: #fcfcfb; }
  .ink     { fill: #0b0b0b; }
  .ink2    { fill: #52514e; }
  .muted   { fill: #898781; }
  .grid    { stroke: #e1e0d9; }
  .axis    { stroke: #c3c2b7; }
  .s0 { stroke: #2a78d6; } .f0 { fill: #2a78d6; }
  .s1 { stroke: #eb6834; } .f1 { fill: #eb6834; }
  .s2 { stroke: #1baf7a; } .f2 { fill: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink     { fill: #ffffff; }
    .ink2    { fill: #c3c2b7; }
    .muted   { fill: #898781; }
    .grid    { stroke: #2c2c2a; }
    .axis    { stroke: #383835; }
    .s0 { stroke: #3987e5; } .f0 { fill: #3987e5; }
    .s1 { stroke: #d95926; } .f1 { fill: #d95926; }
    .s2 { stroke: #199e70; } .f2 { fill: #199e70; }
  }
  text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
  .tick { font-size: 12px; font-variant-numeric: tabular-nums; }
  .lbl  { font-size: 13px; }
  .ttl  { font-size: 17px; font-weight: 600; }
  .sub  { font-size: 13px; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
</style>

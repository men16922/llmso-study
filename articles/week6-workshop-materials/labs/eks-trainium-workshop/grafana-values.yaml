persistence:
  enabled: false
service:
  type: ClusterIP
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: 500m, memory: 1Gi}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Workshop
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards/default
dashboardsConfigMaps:
  default: vllm-dashboard

# KServe InferenceService — Qwen2.5-1.5B on vLLM
#
# 통제 변수는 Ray Serve·Triton·직접 구성과 동일하게 맞춘다.
#   max_model_len 4096 / gpu_memory_utilization 0.85 / max_num_seqs 64
# 다르면 "계층의 가격"이 아니라 "설정 차이"를 재게 된다.
#
# ⚠️ Istio·Knative가 없는 k3s이므로 RawDeployment 모드를 쓴다.
#    (kserve 네임스페이스의 inferenceservice-config에서 전역 전환해 두었고,
#     아래 애노테이션으로 이 리소스에도 명시한다)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen
  namespace: llm-serving-lab
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    # ⚠️ WSL2 k3s에서 GPU 파드는 nvidia 런타임을 명시해야 한다.
    #    빠뜨리면 컨테이너 안에서 CUDA가 보이지 않아 vLLM이 이렇게 죽는다:
    #      No CUDA runtime is found → RuntimeError: Failed to infer device type
    #    2주차 vllm-baseline.yaml·RayService와 같은 조건이다.
    runtimeClassName: nvidia
    model:
      modelFormat:
        name: vLLM
      runtime: kserve-vllmserver
      # 2주차에 받아 둔 HF 캐시를 그대로 쓴다 — 재다운로드 없이 같은 가중치를 보장한다.
      #
      # ⚠️ 스냅샷 폴더를 바로 가리키면 안 된다. HF 캐시의 snapshots/<hash>/ 안 파일들은
      #    ../../blobs/<sha>를 가리키는 심볼릭 링크다. subPath로 그 폴더만 잘라 마운트하면
      #    링크 목적지가 마운트 밖으로 나가 끊기고, vLLM이 이렇게 죽는다:
      #      Invalid repository ID or local directory specified: '/mnt/models'
      #    그래서 캐시 루트째 마운트하고, 아래 --model로 스냅샷 경로를 직접 준다.
      storageUri: pvc://huggingface-cache/
      # ⚠️ KServe 0.20.0이 기본 제공하는 kserve-vllmserver 런타임은 `python`을 실행하는데,
      #    정작 그 런타임이 지정한 vllm/vllm-openai:v0.20.0 이미지에는 `python3`만 있다.
      #    그대로 두면 CrashLoopBackOff:
      #      exec: "python": executable file not found in $PATH
      #    런타임 정의와 이미지가 어긋난 것이므로 여기서 command를 덮어쓴다.
      command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        # 런타임 기본값 --model=/mnt/models를 덮어쓴다 (뒤에 오는 값이 이긴다).
        - --model=/mnt/models/hub/models--Qwen--Qwen2.5-1.5B-Instruct/snapshots/989aa7980e4cf806f80c7fef2b1adb7bc71aa306
        - --max-model-len=4096
        - --gpu-memory-utilization=0.85
        - --max-num-seqs=64
        - --dtype=auto
        # vLLM 0.20.0에서 --disable-log-requests가 없어졌다(→ --no-enable-log-requests).
        # 다른 구성의 --disable-log-requests와 같은 뜻이며 요청 로그만 끄므로 측정에는 중립이다.
        - --no-enable-log-requests
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"

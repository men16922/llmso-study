apiVersion: v1
kind: Namespace
metadata:
  name: performance-testing
---
apiVersion: v1
kind: Pod
metadata:
  name: performance-test-runner
  namespace: performance-testing
spec:
  containers:
    - name: runner
      image: python:3.10-slim
      command: ['sleep', 'infinity']
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: '2', memory: 4Gi}

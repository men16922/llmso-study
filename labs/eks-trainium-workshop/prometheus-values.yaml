server:
  persistentVolume:
    enabled: false
  retention: 15d
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: '1', memory: 2Gi}
  global:
    scrape_interval: 15s
alertmanager:
  enabled: true
  persistence:
    enabled: false
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true
prometheus-pushgateway:
  enabled: false
extraScrapeConfigs: |
  - job_name: vllm-metrics
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['vllm-service.default.svc.cluster.local:8080']

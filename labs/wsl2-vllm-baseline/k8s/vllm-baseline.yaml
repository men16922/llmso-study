apiVersion: v1
kind: Namespace
metadata:
  name: llm-serving-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: huggingface-cache
  namespace: llm-serving-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-baseline
  namespace: llm-serving-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-baseline
  template:
    metadata:
      labels:
        app: vllm-baseline
    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 30
      volumes:
        - name: huggingface-cache
          persistentVolumeClaim:
            claimName: huggingface-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.23.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              exec vllm serve "$MODEL_ID"
              --served-model-name "$SERVED_MODEL_NAME"
              --host 0.0.0.0
              --port 8000
              --dtype auto
              --max-model-len "$MAX_MODEL_LEN"
              --gpu-memory-utilization "$GPU_MEMORY_UTILIZATION"
              --max-num-seqs "$MAX_NUM_SEQS"
              $EXTRA_ARGS
          env:
            - name: MODEL_ID
              value: Qwen/Qwen2.5-1.5B-Instruct
            - name: SERVED_MODEL_NAME
              value: qwen2.5-1.5b
            # 아래 4개는 실습 중 `kubectl set env`로 바꿔가며 롤아웃한다.
            # 예: kubectl -n llm-serving-lab set env deploy/vllm-baseline MAX_NUM_SEQS=64
            - name: MAX_NUM_SEQS
              value: "16"
            - name: MAX_MODEL_LEN
              value: "4096"
            - name: GPU_MEMORY_UTILIZATION
              value: "0.85"
            # 4주차(CH7·CH8) 추가 — 실험마다 다른 플래그를 붙이는 자리.
            # args에서 `$EXTRA_ARGS`는 **따옴표 없이** 전개된다. 셸 단어 분리로
            # 여러 플래그가 되기 때문이고, 따옴표를 씌우면 통째로 인자 하나가 되어
            # vLLM이 "unrecognized arguments"로 죽는다.
            #
            # 아래 플래그 이름은 v0.23.0의 `vllm serve --help=all`에서 실제로
            # 확인한 것이다 (원본: results/e-vllm-help.txt).
            #
            #   redeploy EXTRA_ARGS='--max-num-batched-tokens 512'
            #   redeploy EXTRA_ARGS='--no-enable-prefix-caching'
            #   redeploy EXTRA_ARGS='--spec-method ngram --spec-tokens 5'
            #   redeploy EXTRA_ARGS='--spec-model Qwen/Qwen2.5-0.5B-Instruct --spec-tokens 5'
            #   redeploy EXTRA_ARGS=''            # 원복 (vanilla)
            #
            # `--speculative-config '<JSON>'`도 있지만 평탄화된 `--spec-*`가 낫다 —
            # 여기서는 단어 분리로 전달되므로 JSON에 공백이 하나라도 있으면 쪼개진다.
            - name: EXTRA_ARGS
              value: ""
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 16Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - name: huggingface-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-baseline
  namespace: llm-serving-lab
  labels:
    app: vllm-baseline
spec:
  selector:
    app: vllm-baseline
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-baseline
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - llm-serving-lab
  selector:
    matchLabels:
      app: vllm-baseline
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
